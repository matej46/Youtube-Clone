<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/video.css">
    <link rel="stylesheet" href="styles/sidebar.css">
</head>

<body>

 

    <div class="header">

        <div class="left-section">
            <img class="hamburger-menu" src="icons/hamburger-menu.svg">
            <img class="youtube-logo" src="icons/youtube-logo.svg">
        </div>
        <div class="middle-section">
            <input class="search-bar js-search-bar" type="text" placeholder="Search">
            <button class="search-button js-search-button"><img class="search-icon" src="icons/search.svg">
                <div class="tooltip">Search</div>
            </button>
            <button class="voice-search-button"><img class="voice-search-icon" src="icons/voice-search-icon.svg">
                <div class="tooltip">Search with your voice</div>
            </button>
        </div>
        <div class="right-section">
            <div class="upload-icon-container">
                <img class="upload-icon" src="icons/upload.svg">
                <div class="tooltip">Create</div>
            </div>
            <div class="youtube-apps-container">
                <img class="youtube-apps-icon" src="icons/youtube-apps.svg">
                <div class="tooltip">YouTube apps</div>
            </div>
            <div class="notifications-icon-container">
                <img class="notifications-icon" src="icons/notifications.svg">
                <div class="notifications-count">3</div>
            </div>
            <img class="current-user-picture" src="profile-pic/matej.jpg">
        </div>

    </div>

    <div class="sidebar">
        <div>
            <img src="sidebar-icons/side-bar-icons.svg">
            <span>Home</span>
        </div>
        <div>
            <img src="sidebar-icons/explore.svg">
            <span>Explore</span>
        </div>
        <div>
            <img src="sidebar-icons/subscriptions.svg">
            <span>Subscriptions</span>
        </div>
        <div>
            <img src="sidebar-icons/originals.svg">
            <span>Originals</span>
        </div>
        <div>
            <img src="sidebar-icons/youtube-music.svg">
            <span>YouTube Music</span>
        </div>
        <div>
            <img src="sidebar-icons/library.svg">
            <span>Library</span>
        </div>
    </div>

    <div class="video-grid">
        
    </div>


    <script src="data/videos.js"></script>
    <script src="script.js"></script>
   

</body>

</html>
